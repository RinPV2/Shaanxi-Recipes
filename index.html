<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陕西菜谱</title>
<link rel="stylesheet" href="site/style.css">
<script defer src="site/data.js"></script>
<script defer src="site/app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">陕西菜谱<span class="brand-sub">1970 年代《陕西菜谱》全四册数字化</span></a>
  <nav><a href="https://github.com/RinPV2/Shaanxi-Recipes" rel="noopener">GitHub</a></nav>
</header>

<main class="home">
  <div class="hero">
    <h1>陕西菜谱</h1>
    <p>1970 年代《陕西菜谱》全四册数字化——共 <strong>636</strong> 道菜，641 页原书扫描图逐页校对。</p>
  </div>
  <div class="controls">
    <input id="q" type="search" placeholder="搜索菜名、食材、做法…" autocomplete="off">
    <div class="chips">
      <button class="chip active" data-filter="book" data-value="">全部册</button><button class="chip" data-filter="book" data-value="sxcp-1">第一册</button><button class="chip" data-filter="book" data-value="sxcp-2">第二册</button><button class="chip" data-filter="book" data-value="sxcp-3">第三册</button><button class="chip" data-filter="book" data-value="sxcp-4">第四册</button>
    </div>
    <div class="chips">
      <button class="chip active" data-filter="category" data-value="">全部分类</button><button class="chip" data-filter="category" data-value="凉食(冷饮)类">凉食(冷饮)类</button><button class="chip" data-filter="category" data-value="山珍海味类">山珍海味类</button><button class="chip" data-filter="category" data-value="水产类">水产类</button><button class="chip" data-filter="category" data-value="猪牛羊肉类">猪牛羊肉类</button><button class="chip" data-filter="category" data-value="甜菜类">甜菜类</button><button class="chip" data-filter="category" data-value="禽蛋类">禽蛋类</button><button class="chip" data-filter="category" data-value="稀食类">稀食类</button><button class="chip" data-filter="category" data-value="素菜类">素菜类</button><button class="chip" data-filter="category" data-value="野味类">野味类</button><button class="chip" data-filter="category" data-value="未分类">未分类</button>
    </div>
    <p class="count"><span id="count">636</span> 道菜</p>
  </div>
  <ul id="list" class="grid"></ul>
  <p id="empty" class="empty" hidden>没有匹配的菜谱。</p>
</main>

<footer class="footer">
  <p>《陕西菜谱》(全四册)，陕西省副食服务公司、西安市饮食公司编写，1970 年代内部发行。本站为非营利数字化整理。</p>
  <p>整理内容 CC BY 4.0 · 站点代码 MIT · <a href="https://github.com/RinPV2/Shaanxi-Recipes" rel="noopener">项目仓库</a></p>
</footer>
</body>
</html>
