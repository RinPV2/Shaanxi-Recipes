# 成品站脚注注释（footnotes）
#
# 用途：把「我们的推测/说明」与「照录的原文」分开——正文一律照录原书，
#       判断依据放进注释，正文对应位置挂一个上角标。
#
# 只注影响理解的：
#   - 信息缺失或自相矛盾（原料表未列某味料而制法用到）
#   - 无法用文字表达的（图形刀纹符号等）
#   - 疑似写错但不敢改的分量／字
#   - 菜品来历考据
# 不注按「原书笔误可直接修」政策改掉的常规笔误（偕调→协调 之类，全书上百处，注了成噪音）。
#
# 字段：
#   book_id      必填，sxcp-1 … sxcp-4
#   local_page   必填，本地页码（整数）。跨页菜谱只要 local_pages 里含此页即可命中。
#   anchor       必填，正文里要挂上角标的锚文本。**必须与 vault 笔记里渲染出来的文本逐字一致**
#                （含空格、全角标点、弯引号）；只在 食材／调料／做法／特点 四段里查找，
#                raw_excerpt 与 frontmatter 之外的部分不参与匹配。
#   note         必填，注释正文。
#   slug         选填，显式指定挂到哪篇笔记（文件名去掉 .md）。同一页有多道菜且锚文本
#                在多篇里都出现时用它消歧；不填时按 book_id+local_page 找候选，
#                取第一篇正文里含 anchor 的（笔记名排序，先到先得）。
#
# 加注流程：
#   1. 开页图 work/review_queue/rendered/<book_id>/p<四位页码>.png 看清原书印的是什么；
#   2. 在 work/vault/recipes/*.md 里确认锚文本逐字存在（grep 一下，注意 OCR 的半角空格）；
#   3. 在本文件追加一条；
#   4. 跑 build-site，检查 stats 里 annotations_unmatched == 0（不为 0 说明锚文本没对上，
#      日志里有 WARNING 指出是哪一条）。
#
# 匹配失败不会静默跳过：记 WARNING 并计入 build_site 返回的 annotations_unmatched。

annotations:
  - book_id: sxcp-1
    local_page: 79
    slug: sxcp-1-p0078-条子肉
    anchor: "湿淀粉 一钱半"
    note: >-
      原书调料表这一条之后紧接着还有「菜籽油　平两」（见原书第 69 页页图右下）。「平两」不成量词，
      推测是「半两」之误——「半」字的印版磨损后极易看成「平」，同书别处的油用量也多作「半两」。
      但页图上字形确作「平」，按「字形辨认以图为准」未改。又因「平」不是数词，
      本站的原料解析没能认出这一条，它没有出现在上面的调料清单里，用量请对照页图。
  - book_id: sxcp-1
    local_page: 86
    anchor: "倒入飞成蜜汁"
    note: >-
      两处存疑。其一，「飞」疑为「㸆」之误（㸆＝小火收汁，与「飞成蜜汁」的语境相合），
      但页图上确实印作「飞」，故照录未改。其二，本步用到蜂蜜，而上面的原料表（主料／配料）
      通篇没有列出蜂蜜及用量——原书此处漏列，分量需自行斟酌。
  - book_id: sxcp-2
    local_page: 34
    anchor: "划成 “▤” 形"
    note: >-
      原书这两处印的是图形符号而不是汉字：前一个是内含数条横线的方框（平行刀纹），
      后一个是内含交叉线的方框（十字花刀）。转录时分别以 ▤ 和 ⊠ 代替，字形并不完全相同，
      实际刀纹走向请对照原书第 26 页页图。

