text_replacements:
  - pattern: "\\r\\n?"
    replacement: "\n"
  - pattern: "[\\u3000\\t]+"
    replacement: " "
  - pattern: " +"
    replacement: " "
  - pattern: "\\n{3,}"
    replacement: "\n\n"
  - pattern: "[·•‧⋅]+"
    replacement: "·"
  - pattern: "\\^\\{\\\\circ\\}"
    replacement: "°"
  - pattern: "氽"
    replacement: "汆"
  # ——— 现代汉语规范化（2026-07-28）———
  # 字形辨认仍以页图为准；此处只做「认清之后」的输出归一化：
  # 生僻字 / 异体字 / 方言古语残留 → 现代通行写法，原书原样在校对记录 notes 中留痕。
  # 「介」为常用字，只在明确的刀工语境下替换，避免误伤「介绍」等正常用法。
  - pattern: "搕"
    replacement: "磕"
  - pattern: "介(成|浅|一刀)"
    replacement: "剞\\1"
  - pattern: "茨汁"
    replacement: "芡汁"
  - pattern: "粩糟"
    replacement: "醪糟"
  - pattern: "揽匀"
    replacement: "搅匀"
  - pattern: "密汁羊尾"
    replacement: "蜜汁羊尾"
  - pattern: "虾米饨"
    replacement: "虾米炖"
  - pattern: "山查糕"
    replacement: "山楂糕"
  # ——— 原书正文与目录用字打架时的规范名（用户 2026-07-28 逐条裁定）———
  # 单页记录一律照该页所印；此处只统一进入成品库的规范名。
  # 取舍不按「一律跟正文/一律跟目录」，而是逐条按字义定：
  # 油馍取正文（目录作油果）、蛋黄面取目录（正文作蛋锅面）。
  - pattern: "柽花"
    replacement: "桂花"
  - pattern: "凤干"
    replacement: "风干"
  - pattern: "时晨"
    replacement: "时辰"
  - pattern: "饱子"
    replacement: "包子"
  - pattern: "油果"
    replacement: "油馍"
  - pattern: "蛋锅面"
    replacement: "蛋黄面"
  # ——— 正文侧 OCR / 异体字错字（2026-07-28，由目录锚点与正文菜名交叉核对查出）———
  # 一律做词组限定：「付」是常用字（付款/付出），裸「煳→糊」会误伤「糊辣汤」。
  - pattern: "豆付"
    replacement: "豆腐"
  - pattern: "付竹"
    replacement: "腐竹"
  - pattern: "萄葡"
    replacement: "葡萄"
  - pattern: "爆煳"
    replacement: "爆糊"
  # ——— 表格块内的 OCR 错字（这些表此前被整块丢弃、从未经人校对）———
  # 「餞」是「饯」的繁体而非「钱」的异体，故限定在数字后才替换，
  # 避免把「蜜餞」误改成「蜜钱」。
  - pattern: "([一二三四五六七八九十半])餞"
    replacement: "\\1钱"
  - pattern: "味\\s*粤"
    replacement: "味精"
  # ——— 异体字归一：硷 → 碱（2026-07-28）———
  # 原书自身就不一致：书3 p125 印「白硷 / 石硷（土硷）」，p126 同一工艺却印「碱」。
  # 全库统计 130 处（校对记录）/ 162 处（vault）「硷」，上下文全为碱性物质：
  # 硷面・硷水・硷味・硷质・硷开水・石硷・土硷・白硷・矾硷・掺硷・加硷九钱・不用盐硷，
  # 无人名、地名或其它义项，可无条件替换。归一后食材索引里
  # 「硷面 / 碱面」「石硷 / 石碱」等分裂条目也随之合并。
  - pattern: "硷"
    replacement: "碱"
suspicious_patterns:
  - "\\uFFFD"
  - "[A-Za-z]{6,}"
review_triggers:
  conflicting_titles: 2
  sparse_text_chars: 24
