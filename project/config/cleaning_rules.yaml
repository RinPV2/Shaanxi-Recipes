text_replacements:
  - pattern: "\\r\\n?"
    replacement: "\n"
  - pattern: "[\\u3000\\t]+"
    replacement: " "
  - pattern: " +"
    replacement: " "
  - pattern: "\\n{3,}"
    replacement: "\n\n"
  - pattern: "[·•‧⋅]+"
    replacement: "·"
  - pattern: "\\^\\{\\\\circ\\}"
    replacement: "°"
  - pattern: "氽"
    replacement: "汆"
  # ——— 现代汉语规范化（2026-07-28）———
  # 字形辨认仍以页图为准；此处只做「认清之后」的输出归一化：
  # 生僻字 / 异体字 / 方言古语残留 → 现代通行写法，原书原样在校对记录 notes 中留痕。
  # 「介」为常用字，只在明确的刀工语境下替换，避免误伤「介绍」等正常用法。
  - pattern: "搕"
    replacement: "磕"
  - pattern: "介(成|浅|一刀)"
    replacement: "剞\\1"
  - pattern: "茨汁"
    replacement: "芡汁"
  - pattern: "粩糟"
    replacement: "醪糟"
  - pattern: "揽匀"
    replacement: "搅匀"
  - pattern: "密汁羊尾"
    replacement: "蜜汁羊尾"
  - pattern: "虾米饨"
    replacement: "虾米炖"
  - pattern: "山查糕"
    replacement: "山楂糕"
  # ——— 原书正文与目录用字打架时的规范名（用户 2026-07-28 逐条裁定）———
  # 单页记录一律照该页所印；此处只统一进入成品库的规范名。
  # 取舍不按「一律跟正文/一律跟目录」，而是逐条按字义定：
  # 油馍取正文（目录作油果）、蛋黄面取目录（正文作蛋锅面）。
  - pattern: "柽花"
    replacement: "桂花"
  - pattern: "凤干"
    replacement: "风干"
  - pattern: "时晨"
    replacement: "时辰"
  - pattern: "饱子"
    replacement: "包子"
  - pattern: "油果"
    replacement: "油馍"
  - pattern: "蛋锅面"
    replacement: "蛋黄面"
  # ——— 正文侧 OCR / 异体字错字（2026-07-28，由目录锚点与正文菜名交叉核对查出）———
  # 一律做词组限定：「付」是常用字（付款/付出），裸「煳→糊」会误伤「糊辣汤」。
  - pattern: "豆付"
    replacement: "豆腐"
  - pattern: "付竹"
    replacement: "腐竹"
  - pattern: "萄葡"
    replacement: "葡萄"
  - pattern: "爆煳"
    replacement: "爆糊"
  # ——— 表格块内的 OCR 错字（这些表此前被整块丢弃、从未经人校对）———
  # 「餞」是「饯」的繁体而非「钱」的异体，故限定在数字后才替换，
  # 避免把「蜜餞」误改成「蜜钱」。
  - pattern: "([一二三四五六七八九十半])餞"
    replacement: "\\1钱"
  - pattern: "味\\s*粤"
    replacement: "味精"
  # ——— 异体字归一：硷 → 碱（2026-07-28）———
  # 原书自身就不一致：书3 p125 印「白硷 / 石硷（土硷）」，p126 同一工艺却印「碱」。
  # 全库统计 130 处（校对记录）/ 162 处（vault）「硷」，上下文全为碱性物质：
  # 硷面・硷水・硷味・硷质・硷开水・石硷・土硷・白硷・矾硷・掺硷・加硷九钱・不用盐硷，
  # 无人名、地名或其它义项，可无条件替换。归一后食材索引里
  # 「硷面 / 碱面」「石硷 / 石碱」等分裂条目也随之合并。
  - pattern: "硷"
    replacement: "碱"
  # ——— 扫描杂点：字内插入的孤立标点（2026-07-29，页图逐条核实）———
  # 原书正文与原料表里没有这些标点,它们是扫描件上的墨点/纸伤被 OCR 读成了标点。
  # 后果不只是脏字:「面-粉 五钱」会在原料配对时被切成「粉 五钱」+「面」两条
  # （sxcp-2 p123 锅烧鸭）,「食.盐 四两」切成「盐 四两」+「食」（sxcp-4 p42 风白鱼）。
  #
  # **必须限定在两个汉字之间**,并且**排除量词后面的那一个**:
  # sxcp-1 p20 的「另加油半两.先下葱花」页图上印的是逗号（12× 已核）,
  # 剥掉会把一句话粘成一句,比留着杂点更糟。量词（两/钱/斤/分…）后面的句点一律
  # 视为句读残留而不动。数字之间的小数点、编号点（「1.」）、省略号本就不在此列。
  # 全库命中 3 处:sxcp-1 p35 熟猪.油、sxcp-2 p123 面-粉、sxcp-4 p42 食.盐。
  - pattern: "(?<=[一-鿿])(?<![钱两斤分个只片粒条张朵克根块付副枚棵把碗匙勺撮])[-－.．](?=[一-鿿])"
    replacement: ""
  # 「·」不能照上面一起剥:它在本书里有两个正经用法——版权页的间隔号
  # （「内部发行·供学习研究」,书1/2/4 各一处）和被 OCR 读散的分组标签冒号
  # （sxcp-2 p161「调料·食盐八分」,页图上是「调料：」,剥掉冒号整组调料会被错记成食材）。
  # 因此只剥「汉字·数词」这一种形态——名称与用量之间的杂点。
  # 全库命中 1 处:sxcp-1 p161 中华糕蟹的「肥瘦生猪肉·一 斤」。
  - pattern: "(?<=[一-鿿])·(?=[〇零一二三四五六七八九十百半几])"
    replacement: ""
  # 同族:名称与用量之间的孤立句号（sxcp-4 p93「酱油。 五两」,页图上是一个墨点）。
  # 「汉字。数词」在本书里绝大多数是正常句末（「切成六寸长。四寸宽」「为止。十斤豆子」,
  # 全库 14 处）,所以要求句号后面是**完整的「数词+量词」且到此断开**（后跟空格或行尾）,
  # 这样才只命中原料行的「名称。 用量」。全库命中 1 处。
  - pattern: "(?m)(?<=[一-鿿])。[ ]*(?=[〇零一二三四五六七八九十百半几]+[钱两斤分个只片粒条张朵克根块付副枚棵把碗匙勺撮]半?(?: |$))"
    replacement: " "
  # 笔画残缺:sxcp-1 p79 条子肉的「菜籽油 平两」,20× 页图上是「半」——
  # 两点在最上方、竖笔穿过横画并明显下伸,与同行「一钱半」的「半」同形,
  # 而「平」该有的顶横不存在。全书 200 余处「平」无一作量词（平铺/压平/平底/平刀…）,
  # 「平两」也不成词。仍加前后不接汉字的守卫,免得日后误伤「压平两面」这类词组。
  # 全库命中 1 处。
  - pattern: "(?<![一-鿿])平两(?![一-鿿])"
    replacement: "半两"
suspicious_patterns:
  - "\\uFFFD"
  - "[A-Za-z]{6,}"
review_triggers:
  conflicting_titles: 2
  sparse_text_chars: 24
