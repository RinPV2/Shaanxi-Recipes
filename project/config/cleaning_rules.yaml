text_replacements:
  - pattern: "\\r\\n?"
    replacement: "\n"
  - pattern: "[\\u3000\\t]+"
    replacement: " "
  - pattern: " +"
    replacement: " "
  - pattern: "\\n{3,}"
    replacement: "\n\n"
  - pattern: "[·•‧⋅]+"
    replacement: "·"
  - pattern: "\\^\\{\\\\circ\\}"
    replacement: "°"
  - pattern: "氽"
    replacement: "汆"
  # ——— 现代汉语规范化（2026-07-28）———
  # 字形辨认仍以页图为准；此处只做「认清之后」的输出归一化：
  # 生僻字 / 异体字 / 方言古语残留 → 现代通行写法，原书原样在校对记录 notes 中留痕。
  # 「介」为常用字，只在明确的刀工语境下替换，避免误伤「介绍」等正常用法。
  - pattern: "搕"
    replacement: "磕"
  - pattern: "介(成|浅|一刀)"
    replacement: "剞\\1"
  - pattern: "茨汁"
    replacement: "芡汁"
  - pattern: "粩糟"
    replacement: "醪糟"
  - pattern: "揽匀"
    replacement: "搅匀"
  - pattern: "密汁羊尾"
    replacement: "蜜汁羊尾"
  - pattern: "虾米饨"
    replacement: "虾米炖"
  # 原为「山查糕→山楂糕」,太窄:同族的「炸山查肉夹」（书2 p171 菜名）漏改。
  # 放宽到裸「山查」。全库（parsed_pages,未经任何替换）命中 3 处,无一例外都是山楂:
  # 书1 p8 目录「171.蜜饯挂霜山查糕」、书1 p197「山查糕 一钱」、书2 p171「（一七九）炸山查肉夹」。
  # 「查」作动词时前一字不会是「山」（全书无「上山查看」这类用法),无误伤。
  - pattern: "山查"
    replacement: "山楂"
  # ——— 原书正文与目录用字打架时的规范名（用户 2026-07-28 逐条裁定）———
  # 单页记录一律照该页所印；此处只统一进入成品库的规范名。
  # 取舍不按「一律跟正文/一律跟目录」，而是逐条按字义定：
  # 油馍取正文（目录作油果）、蛋黄面取目录（正文作蛋锅面）。
  - pattern: "柽花"
    replacement: "桂花"
  - pattern: "凤干"
    replacement: "风干"
  - pattern: "时晨"
    replacement: "时辰"
  - pattern: "饱子"
    replacement: "包子"
  - pattern: "油果"
    replacement: "油馍"
  - pattern: "蛋锅面"
    replacement: "蛋黄面"
  # ——— 正文侧 OCR / 异体字错字（2026-07-28，由目录锚点与正文菜名交叉核对查出）———
  # 一律做词组限定：「付」是常用字（付款/付出），裸「煳→糊」会误伤「糊辣汤」。
  - pattern: "豆付"
    replacement: "豆腐"
  - pattern: "付竹"
    replacement: "腐竹"
  - pattern: "萄葡"
    replacement: "葡萄"
  - pattern: "爆煳"
    replacement: "爆糊"
  # ——— 表格块内的 OCR 错字（这些表此前被整块丢弃、从未经人校对）———
  # 「餞」是「饯」的繁体而非「钱」的异体，故限定在数字后才替换，
  # 避免把「蜜餞」误改成「蜜钱」。简体「饯」同理（书4 p68 五香鸭块「糖 五饯 绍酒 一两」，
  # 30× 页图与同页第三行的「硝水 二钱」逐笔对照：左偏旁三横穿竖，是钅不是饣的横折钩，
  # 只是印痕糊连被 OCR 读成了饯）。全库其余「饯」是蜜饯山药／蜜饯挂霜山楂／
  # 蜜饯张口酥饺／糖饯樱桃／饯酒菜，前一字都不是数词，不受这条影响。
  - pattern: "([一二三四五六七八九十半])[餞饯]"
    replacement: "\\1钱"
  - pattern: "味\\s*粤"
    replacement: "味精"
  # ——— 异体字归一：硷 → 碱（2026-07-28）———
  # 原书自身就不一致：书3 p125 印「白硷 / 石硷（土硷）」，p126 同一工艺却印「碱」。
  # 全库统计 130 处（校对记录）/ 162 处（vault）「硷」，上下文全为碱性物质：
  # 硷面・硷水・硷味・硷质・硷开水・石硷・土硷・白硷・矾硷・掺硷・加硷九钱・不用盐硷，
  # 无人名、地名或其它义项，可无条件替换。归一后食材索引里
  # 「硷面 / 碱面」「石硷 / 石碱」等分裂条目也随之合并。
  - pattern: "硷"
    replacement: "碱"
  # ——— 扫描杂点：字内插入的孤立标点（2026-07-29，页图逐条核实）———
  # 原书正文与原料表里没有这些标点,它们是扫描件上的墨点/纸伤被 OCR 读成了标点。
  # 后果不只是脏字:「面-粉 五钱」会在原料配对时被切成「粉 五钱」+「面」两条
  # （sxcp-2 p123 锅烧鸭）,「食.盐 四两」切成「盐 四两」+「食」（sxcp-4 p42 风白鱼）。
  #
  # **必须限定在两个汉字之间**,并且**排除量词后面的那一个**:
  # sxcp-1 p20 的「另加油半两.先下葱花」页图上印的是逗号（12× 已核）,
  # 剥掉会把一句话粘成一句,比留着杂点更糟。量词（两/钱/斤/分…）后面的句点一律
  # 视为句读残留而不动。数字之间的小数点、编号点（「1.」）、省略号本就不在此列。
  # 全库命中 3 处:sxcp-1 p35 熟猪.油、sxcp-2 p123 面-粉、sxcp-4 p42 食.盐。
  - pattern: "(?<=[一-鿿])(?<![钱两斤分个只片粒条张朵克根块付副枚棵把碗匙勺撮])[-－.．](?=[一-鿿])"
    replacement: ""
  # 「·」不能照上面一起剥:它在本书里有两个正经用法——版权页的间隔号
  # （「内部发行·供学习研究」,书1/2/4 各一处）和被 OCR 读散的分组标签冒号
  # （sxcp-2 p161「调料·食盐八分」,页图上是「调料：」,剥掉冒号整组调料会被错记成食材）。
  # 因此只剥「汉字·数词」这一种形态——名称与用量之间的杂点。
  # 全库命中 1 处:sxcp-1 p161 中华糕蟹的「肥瘦生猪肉·一 斤」。
  - pattern: "(?<=[一-鿿])·(?=[〇零一二三四五六七八九十百半几])"
    replacement: ""
  # 同族:名称与用量之间的孤立句号（sxcp-4 p93「酱油。 五两」,页图上是一个墨点）。
  # 「汉字。数词」在本书里绝大多数是正常句末（「切成六寸长。四寸宽」「为止。十斤豆子」,
  # 全库 14 处）,所以要求句号后面是**完整的「数词+量词」且到此断开**（后跟空格或行尾）,
  # 这样才只命中原料行的「名称。 用量」。全库命中 1 处。
  - pattern: "(?m)(?<=[一-鿿])。[ ]*(?=[〇零一二三四五六七八九十百半几]+[钱两斤分个只片粒条张朵克根块付副枚棵把碗匙勺撮]半?(?: |$))"
    replacement: " "
  # 笔画残缺:sxcp-1 p79 条子肉的「菜籽油 平两」,20× 页图上是「半」——
  # 两点在最上方、竖笔穿过横画并明显下伸,与同行「一钱半」的「半」同形,
  # 而「平」该有的顶横不存在。全书 200 余处「平」无一作量词（平铺/压平/平底/平刀…）,
  # 「平两」也不成词。仍加前后不接汉字的守卫,免得日后误伤「压平两面」这类词组。
  # 全库命中 1 处。
  - pattern: "(?<![一-鿿])平两(?![一-鿿])"
    replacement: "半两"
  # ═══ 2026-07-30 用户裁定（work/reports/待裁定.csv 第 1/3 类）═══
  #
  # ——— A. OCR 讹字（「莱」被读成「菜」的残留;CLAUDE.md 早已判定为讹字却一直没执行替换）———
  # 全库（parsed_pages,未经任何替换）「莱」共 8 处,逐处看过,无一处是真的「莱」
  # （无莱阳/蓬莱/莱菔）:莱籽油×5、莱籽汕×1、大白莱×1、走莱时×1。
  # 仍用窄模式而不是裸「莱→菜」,免得日后补入新册时误伤「莱菔」这类真词。
  # 「莱籽汕」（书4 p68 樱桃鸭 用料末行）两处讹字叠在一起。18×/22× 页图核对:该字右半
  # **只印出三道竖笔,横笔全部失墨**——左一短竖、中间一长竖上下都出头、右一竖。
  # 与同页上方那一行（同字号同字体）印得完好的「菜籽油」逐笔对照:那个「油」的「由」
  # 三道横笔本来就印得极细（灰色发虚),竖笔却是浓黑;三道竖笔的长短、中竖上下出头的位置、
  # 整个部件在字格里的高度占比,两者完全一致。若是「汕」,「山」应当矮而宽、坐在一道
  # 底横上、中竖不会顶到字格上沿。故判为「油」的横笔失墨,作菜籽油。
  - pattern: "莱籽汕"
    replacement: "菜籽油"
  - pattern: "莱籽"
    replacement: "菜籽"
  - pattern: "大白莱"
    replacement: "大白菜"
  - pattern: "走莱"
    replacement: "走菜"
  # 「波菜」（书1 p28 硬汁里脊）:同库其余 40+ 处均作菠菜;同族的 p43/p119 两处已由
  # 人工校对记录改过,只剩这一处漏网。命中 1 处。
  - pattern: "波菜"
    replacement: "菠菜"
  # 「矶」(U+77F6) 是「矾」的形近讹字。书3 p76 炒凉粉的原料表里印作「白 矶 五钱」
  # （名称与用量之间是原书的对齐空格,所以不能写成「白矶」那样的词组模式）。
  # 全库仅 1 处,「矶」在现代汉语里近乎不用,无条件替换。
  - pattern: "矶"
    replacement: "矾"
  #
  # ——— B. 生僻/形近误植 → 现代通行写法（置信度高,页图字形与 OCR 一致,改的是「用字」不是「辨认」）———
  # 「茉」是「末」的形近误植:全书一致作「芥茉」,而通行写法无此词。
  # 命中 16 处（菜名 芥茉肘子 p51 / 芥茉拌肚丝 p61,原料 芥茉糊/芥茉面,特点「芥茉喷香」)。
  - pattern: "芥茉"
    replacement: "芥末"
  # 「合页饼」= 荷叶饼（烤鸭配吃的两层薄饼)。同书另有「荷叶米粉肉」「鲜荷叶」用「荷叶」,
  # 属同书内部笔误。命中 5 处,全部在书3 p60-61 这一道菜及其目录条目里。
  - pattern: "合页饼"
    replacement: "荷叶饼"
  # 「拨/拔」形近。拔丝是通行工艺名,同库另有「拔丝香蕉」作对照。命中 1 处（书2 p169 菜名）。
  # 用「拨丝」而不是裸「拨」:同书 p77 有正经的「炒拨鱼」。
  - pattern: "拨丝"
    replacement: "拔丝"
  # 「蕃」是「番」的旧写。命中 15 处,全为原料名 蕃茄/蕃茄酱/蕃茄汁。
  - pattern: "蕃茄"
    replacement: "番茄"
  # 甘蓝（即莲花白)的「兰」为同音简写。命中 6 处（书4 p92 菜名 酸辣甘兰 + 正文 + 目录条目）。
  - pattern: "甘兰"
    replacement: "甘蓝"
  #
  # ——— C. 同书内部两种写法并存 → 归一到多数派（票数见注）———
  # 汤元 2 : 汤圆 0,但「汤圆」是现代通行写法而「汤元」是旧写;
  # 同库「元宵」独立成篇（书3 p96),是另一种食品,**不受影响**（模式限定为「汤元」）。
  - pattern: "汤元"
    replacement: "汤圆"
  # 菜子油 3 : 菜籽油 800+。命中 3 处。
  - pattern: "菜子油"
    replacement: "菜籽油"
  # 调合面 5 : 调和面 47（书3「调和面」= 混合香料面)。命中 5 处。
  - pattern: "调合面"
    replacement: "调和面"
  # 虾子 16 : 虾籽 98。命中的 16 处逐处看过语境,全部指虾卵（「漂净虾子中的沙子」
  # 「撒上一行虾子」「净虾子一两」),没有一处是「整只虾」,归一无歧义。
  - pattern: "虾子"
    replacement: "虾籽"
  # 溜 51 : 熘 4。归一到多数派「溜」。命中 4 处
  # （书2 p19 焦熘里脊片、p23 炸熘鹅黄肉卷,书4 p88 熘瓜条 + 其目录条目)。
  - pattern: "熘"
    replacement: "溜"
  #
  # ——— D. 目录与正文菜名打架,用户逐条裁定「按目录」的三条 ———
  # 其余同类一律以正文为准（见 title_policy.py),这三条是例外,故用词组限定,
  # 不得放宽成裸「子鸡→仔鸡」「胗→肫」「絮→素」:
  #   子鸡 12 : 仔鸡 13（熬炒子鸡 裁定保留正文的「子」),胗 16 : 肫 20,「面絮」全书 28 处。
  - pattern: "干烧子鸡"
    replacement: "干烧仔鸡"
  - pattern: "口蘑汆胗肝"
    replacement: "口蘑汆肫肝"
  - pattern: "五柳絮鱼"
    replacement: "五柳素鱼"
  #
  # ——— E. 回页图核对后**确认是 OCR 误读**的两条（其余同批全部核为原书用字,不动)———
  # 「油算」其实是「油箅」（书3 p33 菜名「油算、油馍、糖饼」）。改用 PDF 内嵌原图
  # （2398×3397,比 rendered PNG 清 2 倍）,正文那一处放到 30× 并做逐像素二值制图:
  # 竹字头无疑;中部字框内**只有 3 条横（2 格）且正中一条贯通的竖**,宽 35px 高 22px 宽扁形。
  # 同书同字体对照:「直」的「目」是 4 横 3 格无中竖、字框竖长;同页「馃」的「田」正是
  # 3 横 + 中竖,与待辨字同型。→ 中部是「田」不是「目」,「竹+田」只有「箅」。命中 2 处。
  - pattern: "油算"
    replacement: "油箅"
  # 「枣沫」其实是「枣沫糊」(书3 p123 菜名),OCR 漏读末字。对标题行做逐列着墨统计:
  # 「枣」1236-1296、「沫」1349-1407、**第三字 1455-1516**,此后到图右缘 880px 全空白
  # （既没裁边也没被页边距压掉);第三字左「米」中「古」右「月」三部件俱全 → 「糊」。
  # 目录条目本来就作「枣沫糊」,两侧一致。负向预查防止把目录里已经对的「枣沫糊」
  # 改成「枣沫糊糊」。命中 1 处。
  - pattern: "枣沫(?!糊)"
    replacement: "枣沫糊"
  #
  # ═══ 2026-07-30（第二批）页图逐字核对后的落地 ═══
  #
  # ——— F. OCR / 转录漏字 ———
  # 「镇川干炉」漏了末字。书3 p40 页首标题在页图上是**五个字**「（三一）镇川干炉馍」，
  # 同页制法 2「上面可刻印一个花纹。即成“干炉馍”」、制法 3「将干炉馍放入火鏊上」
  # 两处自证，目录（书3 p4）也作「镇川干炉馍」。负向预查防止把已经对的「干炉馍」
  # 改成「干炉馍馍」。命中 1 处（就是那个标题）。
  - pattern: "镇川干炉(?!馍)"
    replacement: "镇川干炉馍"
  # ——— G. 原书换行断字造成的假空格 ———
  # 书3 p69 三原疙瘩面 原料行的「元 桂」：页图上「元」在行尾、「桂」在次行行首，
  # 那不是「品名 分量」的字段分隔，而是**原书换行断的一个词**（元桂＝肉桂，
  # CLAUDE.md 已把它列进「行业用字，保留」名单）。三处互证：同页制法 2「元桂一节」、
  # 制法 3「元桂、调料面等」都不带空格，书3 p12 牛（羊）肉煮馍原料表作「元桂 一两」。
  # 用字符类而不是裸空格：块文本要在 normalize_text 之前过替换，可能还留着全角空格。
  # 命中 1 处——**不会误伤**真正以对齐空格分隔的「品名 分量」（「桂」不是数词）。
  - pattern: "元[ 　]+桂"
    replacement: "元桂"
  # ——— H. 「干爦」：方言本字，不是「烩」（2026-07-30 页图核定，属字形辨认）———
  # 书3 p69 全页三处同一字形（顶部「再浇上干爦肉稍子即成」、原料行「干爦肉稍子」、
  # 制法 3「干爦稍子：猪槽头肉切小丁…」）：左火旁，右部是简体「览」（上⺌带点、
  # 下「见」带钩），即「爦（＝燣）lǎn」——陕西方言「爦臊子」的爦（小火㸆炒肉丁）。
  # 与同页并排的「烧」逐笔比对明显不同（烧右部是「尧」、无闭合环）。
  # MinerU 原始 OCR 两处分别猜「榄」「缆」，右部一致为「览」，旁证成立；
  # 上一轮校对员按常见字写成了「烩」，那是**误认**而非原书用字，故改回。
  # 词组限定为「干烩」：同书另有正经的「炒饼、烩饼、焖饼」「烩菜」。
  # 命中 3 处（全在书3 p69）。**书3 p72 的「烩梢子」「烧梢子」未核对，本轮不动。**
  - pattern: "干烩"
    replacement: "干爦"
  # ——— I. 「稍子」→「臊子」：原书一贯写法归现代汉语（2026-07-30）———
  # 页图上全书一致作禾旁「稍」（书3 p68 铜川大刀面「肉稍子 一两」、p67 大荔炉齿面
  # 「汤稍子」「花稍子」、p73 岐山面「素稍子」「白稍子」「肉稍子」…），**是原书的一贯
  # 写法而不是个别讹字**，所以不按「原书笔误」处理，而按「用字方针：现代汉语规范化」
  # 归一到通行的「臊子」（原书原样在本注释与站点脚注里留痕）。
  # 同时收「梢子」：上一轮校对员在 14 处 `正确内容` 里把它写成了木旁「梢」
  # （页图上没有一处是木旁），归一后这批分裂写法一并合并。
  # 词组限定为「稍/梢 + 子」：全书 200 余处作副词的「稍」（稍焖／稍煸／稍煮）不受影响。
  # 命中 26 处（稍子 12 + 梢子 14），逐处看过语境，无一例外都是肉臊子/汤臊子/素臊子。
  - pattern: "[稍梢]子"
    replacement: "臊子"
suspicious_patterns:
  - "\\uFFFD"
  - "[A-Za-z]{6,}"
review_triggers:
  conflicting_titles: 2
  sparse_text_chars: 24
