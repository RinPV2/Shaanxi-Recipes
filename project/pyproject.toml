[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shanxi-pipeline"
version = "0.1.0"
description = "Local MinerU-to-Obsidian pipeline for the Shanxi cookbook corpus."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PyYAML>=6.0.3",
  "PyMuPDF>=1.27.2",
  "Pillow>=11.0",
]

[project.scripts]
shanxi-pipeline = "shanxi_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
